[project]
name = "x-agent-day1"
version = "0.1.0"
description = "Decentralized agent negotiation with HTTP, durable sessions and a local TUI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "textual>=0.89,<9",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xagent"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
